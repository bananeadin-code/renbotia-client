<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="RenBotIA — Bot de WhatsApp con IA para negocios en México">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Glifo/logo -->
  <g transform="translate(90,120)">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="#ffffff"/>
    <text x="48" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" fill="#059669" text-anchor="middle">R</text>
  </g>
  <text x="206" y="192" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">RenBotIA</text>
  <text x="90" y="330" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">Tu asistente de WhatsApp</text>
  <text x="90" y="408" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">con inteligencia artificial</text>
  <text x="90" y="486" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="500" fill="#d1fae5">Responde, agenda y capta clientes 24/7 · Hecho en México</text>
  <g transform="translate(90,520)">
    <rect x="0" y="0" width="230" height="58" rx="29" fill="#ffffff"/>
    <text x="115" y="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#059669" text-anchor="middle">renbotia.com</text>
  </g>
